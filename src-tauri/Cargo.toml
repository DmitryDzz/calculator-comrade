[package]
name = "calculator-comrade"
version = "0.0.1"
description = "Classic pocket calculator emulator"
authors = ["Dmitry Dzakhov"]
license = "MIT"
repository = "https://github.com/DmitryDzz/calculator-comrade"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
rodio = { version = "0.20.1", default-features = false, features = ["wav"] }
tauri-plugin-opener = "2"
